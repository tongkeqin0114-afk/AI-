<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 视频创作</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#171717;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:28px 20px 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:80px}h1{font-size:clamp(40px,7vw,64px);line-height:1.08;letter-spacing:-.04em;margin:0 0 18px}.muted{color:#777}.card{background:#fff;border:1px solid #e5e5e0;border-radius:24px;padding:18px;box-shadow:0 5px 25px #00000008}textarea,input,select{font:inherit;border:0;outline:0;background:#f7f7f5;border-radius:14px;padding:14px;width:100%}textarea{min-height:180px;resize:vertical;font-size:17px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.btn{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;background:#171717;color:white;cursor:pointer}.btn:disabled{background:#ddd}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;color:#999;font-size:13px}.hidden{display:none}.script{min-height:480px;margin-top:15px;background:white;border:1px solid #e5e5e0}.pill{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:8px 12px;font-size:12px;color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr}header{margin-bottom:55px}} </style></head><body><main><header><b>AI 视频创作</b><span class="muted">灵感 → 脚本 → 素材 → 成片</span></header><section id="create"><span class="pill">GitHub Pages 演示版</span><h1>把一个想法，变成一条视频。</h1><p class="muted">输入灵感，先生成符合你固定五段结构的原创口播脚本。这个 GitHub 版本无需服务器即可直接体验。</p><div class="card" style="margin-top:32px"><textarea id="idea" placeholder="写下你的灵感……例如：真正的内耗，不是事情太多，而是想得太多却不行动。"></textarea><div class="grid"><select id="template"><option>王阳明心学</option><option>禅意思考</option><option>人生感悟</option><option>传统文化</option></select><select id="length"><option>30 秒</option><option selected>45 秒</option><option>60 秒</option><option>90 秒</option></select><select id="tone"><option selected>沉稳、有力量</option><option>温和、克制</option><option>犀利、有冲击</option><option>口语、接地气</option></select></div><button class="btn" id="go">开始创作 →</button><p id="status" class="muted" style="text-align:center;font-size:12px"></p></div><div class="steps"><span>① 灵感</span><span>→</span><span>② 原创脚本</span><span>→</span><span>③ 原始素材</span><span>→</span><span>④ 自动剪辑</span></div></section><section id="result" class="hidden"><button onclick="back()" style="border:0;background:none;padding:0;color:#777;cursor:pointer">← 重新开始</button><h2>原创脚本</h2><div class="card"><div class="steps"><span>01 开场核心金句</span><span>02 反常识钩子</span><span>03 大多数人的认知 + 举例说明</span><span>04 正确理解和说明</span><span>05 结尾</span></div><textarea id="script" class="script"></textarea><div style="display:flex;justify-content:space-between;margin-top:12px"><span id="count" class="muted"></span><button class="btn" style="width:auto;padding:11px 18px;margin:0" onclick="copyScript()">复制脚本</button></div></div><div class="card" style="margin-top:14px"><b>下一步</b><p class="muted">当前 GitHub Pages 版是纯前端演示，不需要配置 API Key。需要真正调用 OpenAI 和 FFmpeg 自动剪辑时，再运行仓库里的完整 Docker 版本。</p></div></section></main><script>const demo=i=>`开场核心金句：\n真正让一个人变强的，不是想得更多，而是想明白以后，马上去做。\n\n反常识钩子：\n很多人以为，内耗来自事情太多。其实很多时候，内耗来自迟迟不肯行动。\n\n大多数人的认知 + 举例说明：\n遇到一个问题，我们会反复分析；准备做一件事，又担心做错；别人一句话，也能在脑子里反复回放。看起来是在认真思考，实际上却一直停在原地。\n\n正确理解和说明：\n真正的成长，不是把所有可能都想清楚以后再开始，而是在行动中不断修正。知道该做什么，就先做第一步。行动会带来新的信息，也会让很多焦虑自然消失。\n\n结尾：\n人最怕的不是走错路，而是站在原地，把人生想了一遍又一遍，却始终没有真正走出去。`;document.getElementById("go").onclick=()=>{const v=document.getElementById("idea").value.trim();if(!v)return;document.getElementById("go").disabled=true;document.getElementById("status").textContent="正在生成原创脚本…";setTimeout(()=>{document.getElementById("script").value=demo(v);document.getElementById("count").textContent=document.getElementById("script").value.replace(/\\s/g,"").length+" 字";document.getElementById("create").classList.add("hidden");document.getElementById("result").classList.remove("hidden")},500)};document.getElementById("script").oninput=e=>document.getElementById("count").textContent=e.target.value.replace(/\\s/g,"").length+" 字";function back(){document.getElementById("result").classList.add("hidden");document.getElementById("create").classList.remove("hidden");document.getElementById("go").disabled=false;document.getElementById("status").textContent=""}function copyScript(){navigator.clipboard?.writeText(document.getElementById("script").value);alert("已复制")}</script></body></html>
