services:
  worker:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - video_data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_VIDEO_API_URL: http://localhost:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    depends_on:
      - worker
volumes:
  video_data:
